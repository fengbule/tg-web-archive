# Empty keys are not counted: normal browsing and video requests are unaffected.
map $uri $auth_limit_key {
  default "";
  /api/auth/login $binary_remote_addr;
  /api/telegram/qr/start $binary_remote_addr;
  /api/settings/telegram-credentials/reveal $binary_remote_addr;
  /api/settings/passwords/admin $binary_remote_addr;
  /api/settings/passwords/view $binary_remote_addr;
}
limit_req_zone $auth_limit_key zone=admin_auth:1m rate=10r/m;
server {
  listen 80;
  server_name _;
  client_max_body_size 1m;
  limit_req zone=admin_auth burst=20 nodelay;
  limit_req_status 429;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  sendfile on;
  sendfile_max_chunk 4m;
  tcp_nopush on;
  tcp_nodelay on;
  open_file_cache max=1000 inactive=60s;
  open_file_cache_valid 120s;
  location /protected-media/ {
    internal;
    alias /data/telegram-video-manager/media/;
  }
  location / {
    proxy_pass http://app:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_buffering off;
  }
}
